{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">
      <i class="bi bi-grid-3x3-gap me-2"></i> 자리관리
    </h4>
  </div>

  <p class="text-muted small mb-3">자리관리할 출강장소를 선택하세요.</p>

  {% if institutions %}
    <div class="row mt-3">
      {% for inst in institutions %}
        <div class="col-md-4 mb-3">
          <div class="card shadow-sm h-100 hover-shadow">
            <div class="card-body text-center">
              <h5 class="card-title mb-2">{{ inst.name }}</h5>
              <p class="text-muted small">{{ inst.program }}</p>

              <div class="d-flex justify-content-center gap-2 mt-2">
                <a href="{% url 'seating:seat_manage' inst.id %}"
                   class="btn btn-outline-success btn-sm">
                  자리 관리 <i class="bi bi-arrow-right"></i>
                </a>
              </div>

            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-secondary mt-3">
      등록된 출강장소가 없습니다.
    </div>
  {% endif %}

</div>
{% endblock %}
